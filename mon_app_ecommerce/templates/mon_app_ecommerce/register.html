{% extends 'mon_app_ecommerce/base.html' %}

{% block title %}Register - Shop{% endblock %}

{% block content %}
<div class="flex items-center justify-center min-h-[calc(100vh-200px)]">
    <div class="card bg-base-100 shadow-2xl w-full max-w-md">
        <div class="card-body">
            <h1 class="text-3xl font-bold text-center mb-6">
                <i class="fas fa-user-plus mr-2 text-primary"></i>Register
            </h1>

            <form method="post">
                {% csrf_token %}

                <div class="grid grid-cols-2 gap-4 mb-4">
                    <div class="form-control">
                        <label class="label">
                            <span class="label-text">First Name</span>
                        </label>
                        <input type="text" name="first_name" class="input input-bordered w-full" required />
                    </div>

                    <div class="form-control">
                        <label class="label">
                            <span class="label-text">Last Name</span>
                        </label>
                        <input type="text" name="last_name" class="input input-bordered w-full" required />
                    </div>
                </div>

                <div class="form-control mb-4">
                    <label class="label">
                        <span class="label-text">Username</span>
                    </label>
                    <input type="text" name="username" class="input input-bordered w-full" required autofocus />
                </div>

                <div class="form-control mb-4">
                    <label class="label">
                        <span class="label-text">Email</span>
                    </label>
                    <input type="email" name="email" class="input input-bordered w-full" required />
                </div>

                <div class="form-control mb-4">
                    <label class="label">
                        <span class="label-text">Password</span>
                    </label>
                    <input type="password" name="password" class="input input-bordered w-full" required />
                </div>

                <div class="form-control mb-6">
                    <label class="label">
                        <span class="label-text">Confirm Password</span>
                    </label>
                    <input type="password" name="password2" class="input input-bordered w-full" required />
                </div>

                <button type="submit" class="btn btn-primary btn-block mb-4">
                    <i class="fas fa-user-plus mr-2"></i>Register
                </button>
            </form>

            <div class="divider">OR</div>

            <p class="text-center text-sm">
                Already have an account?
                <a href="{% url 'login' %}" class="link link-primary">Login here</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
