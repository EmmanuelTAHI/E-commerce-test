{% extends 'mon_app_ecommerce/base.html' %}

{% block title %}Modifier le Produit - Shop{% endblock %}

{% block content %}
<div class="container mx-auto px-4 py-8">
    <div class="max-w-4xl mx-auto">
        <div class="flex items-center justify-between mb-8">
            <h1 class="text-4xl font-bold">
                <i class="fas fa-edit mr-2 text-primary"></i>Modifier le Produit
            </h1>
            <a href="{% url 'seller_dashboard' %}" class="btn btn-ghost">
                <i class="fas fa-arrow-left mr-2"></i>Retour au tableau de bord
            </a>
        </div>

        <div class="card bg-base-100 shadow-2xl">
            <div class="card-body">
                <form method="post" enctype="multipart/form-data">
                    {% csrf_token %}

                    <div class="form-control mb-4">
                        <label class="label">
                            <span class="label-text font-semibold">Nom du produit <span class="text-error">*</span></span>
                        </label>
                        <input type="text" name="name" value="{{ product.name }}" class="input input-bordered w-full" required />
                    </div>

                    <div class="form-control mb-4">
                        <label class="label">
                            <span class="label-text font-semibold">Description <span class="text-error">*</span></span>
                        </label>
                        <textarea name="description" class="textarea textarea-bordered" rows="6" required>{{ product.description }}</textarea>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                        <div class="form-control">
                            <label class="label">
                                <span class="label-text font-semibold">Prix (FCFA) <span class="text-error">*</span></span>
                            </label>
                            <input type="number" name="price" step="0.01" min="0" value="{{ product.price }}" class="input input-bordered w-full" required />
                        </div>

                        <div class="form-control">
                            <label class="label">
                                <span class="label-text font-semibold">Prix réduit (FCFA)</span>
                            </label>
                            <input type="number" name="discount_price" step="0.01" min="0" value="{{ product.discount_price|default:'' }}" class="input input-bordered w-full" />
                            <label class="label">
                                <span class="label-text-alt text-gray-500">Laissez vide si pas de réduction</span>
                            </label>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                        <div class="form-control">
                            <label class="label">
                                <span class="label-text font-semibold">Catégorie <span class="text-error">*</span></span>
                            </label>
                            <select name="category" class="select select-bordered w-full" required>
                                {% for category in categories %}
                                <option value="{{ category.id }}" {% if category.id == product.category.id %}selected{% endif %}>{{ category.name }}</option>
                                {% endfor %}
                            </select>
                        </div>

                        <div class="form-control">
                            <label class="label">
                                <span class="label-text font-semibold">Stock <span class="text-error">*</span></span>
                            </label>
                            <input type="number" name="stock" min="0" value="{{ product.stock }}" class="input input-bordered w-full" required />
                        </div>
                    </div>

                    <div class="form-control mb-4">
                        <label class="label">
                            <span class="label-text font-semibold">Image du produit</span>
                        </label>
                        <div class="mb-2">
                            <img src="{{ product.image.url }}" alt="{{ product.name }}" class="w-32 h-32 object-cover rounded-lg" />
                        </div>
                        <input type="file" name="image" accept="image/*" class="file-input file-input-bordered w-full" />
                        <label class="label">
                            <span class="label-text-alt text-gray-500">Laisser vide pour conserver l'image actuelle</span>
                        </label>
                    </div>

                    <div class="form-control mb-6">
                        <label class="label cursor-pointer justify-start gap-4">
                            <input type="checkbox" name="is_featured" class="checkbox checkbox-primary" {% if product.is_featured %}checked{% endif %} />
                            <span class="label-text font-semibold">Produit vedette</span>
                        </label>
                        <label class="label cursor-pointer justify-start gap-4">
                            <input type="checkbox" name="is_active" class="checkbox checkbox-primary" {% if product.is_active %}checked{% endif %} />
                            <span class="label-text font-semibold">Produit actif</span>
                        </label>
                    </div>

                    <div class="flex gap-4">
                        <button type="submit" class="btn btn-primary btn-lg flex-1">
                            <i class="fas fa-save mr-2"></i>Enregistrer les modifications
                        </button>
                        <a href="{% url 'seller_dashboard' %}" class="btn btn-ghost btn-lg">
                            <i class="fas fa-times mr-2"></i>Annuler
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
